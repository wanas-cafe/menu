<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120e07">
<title>ونس كافيه · المنيو</title>
<meta name="description" content="منيو ونس كافيه — مشروبات، حلويات، ومأكولات.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120e07; --panel:rgba(255,255,255,.028); --panel2:rgba(255,255,255,.05);
  --gold:#EDCF86; --gold2:#C49A4A; --line:rgba(196,154,74,.22); --line2:rgba(196,154,74,.42);
  --item:#E2CDA0; --sub:#a68e5c; --star:#E2A98A;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:150px}
body{
  font-family:Tajawal,system-ui,-apple-system,sans-serif; color:var(--item);
  background:var(--bg); min-height:100vh; overflow-x:hidden;
  padding-bottom:calc(70px + env(safe-area-inset-bottom));
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(ellipse 90% 55% at 50% -5%, rgba(196,154,74,.16), transparent 60%),
    radial-gradient(ellipse 70% 50% at 100% 100%, rgba(196,154,74,.07), transparent 60%),
    #120e07;
}
button,input{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px;border-radius:8px}
::selection{background:rgba(196,154,74,.3)}

/* ================= hero ================= */
.hero{text-align:center;padding:30px 18px 18px;position:relative}
.hero .ring{
  width:112px;height:112px;margin:0 auto 12px;border-radius:50%;
  display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%, rgba(196,154,74,.16), transparent 68%);
}
.hero img{width:104px;height:104px;display:block}
.hero h1{font-family:Amiri,serif;font-size:clamp(30px,8vw,40px);color:#F6E4B8;line-height:1.15}
.hero .sep{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px auto 0;max-width:260px}
.hero .sep i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line2))}
.hero .sep b{color:var(--gold2);font-size:11px}
.hero .tag{font-size:11px;color:var(--sub);letter-spacing:.34em;margin-top:9px}

/* ================= sticky bar ================= */
.bar{position:sticky;top:0;z-index:40;background:rgba(18,14,7,.82);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);transition:box-shadow .2s}
.bar.stuck{box-shadow:var(--shadow)}
.bar .in{max-width:1200px;margin:0 auto;padding:9px 12px;display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  flex:0 0 auto;font-size:14.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 18px;
  color:var(--item);transition:.16s}
.tabs button:hover{border-color:var(--line2)}
.tabs button.on{background:linear-gradient(180deg,rgba(196,154,74,.22),rgba(196,154,74,.08));
  color:#F6E4B8;border-color:var(--gold2)}
.srch{position:relative;flex:0 0 auto;width:44px;transition:width .25s cubic-bezier(.4,0,.2,1)}
.srch.open{width:min(260px,46vw)}
.srch input{
  width:100%;height:40px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel2);padding:0 38px 0 34px;font-size:14.5px;outline:none;
  opacity:0;pointer-events:none;transition:.2s}
.srch.open input{opacity:1;pointer-events:auto}
.srch input::placeholder{color:#8a7443}
.srch .ico{position:absolute;top:0;right:0;width:40px;height:40px;display:grid;place-items:center;
  border:1px solid var(--line);border-radius:999px;background:var(--panel2);cursor:pointer;color:var(--gold)}
.srch.open .ico{border:none;background:transparent}
.srch .clr{position:absolute;top:0;left:0;width:34px;height:40px;display:none;place-items:center;
  background:none;border:none;cursor:pointer;color:var(--sub);font-size:19px}
.srch.open.has .clr{display:grid}

/* section quick-jump */
.jump{max-width:1200px;margin:0 auto;padding:0 12px 9px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:0 0 auto;font-size:12.5px;font-weight:500;text-decoration:none;color:var(--sub);
  border:1px solid transparent;border-radius:999px;padding:5px 12px;transition:.16s}
.jump a:hover{color:var(--item)}
.jump a.on{color:#F6E4B8;background:var(--panel2);border-color:var(--line)}

/* ================= content ================= */
main{max-width:1200px;margin:0 auto;padding:18px 12px 10px}
.page{display:none;animation:fade .3s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

.ttl{text-align:center;margin:2px 0 20px}
.ttl h2{font-family:Amiri,serif;font-size:30px;color:#F6E4B8}
.ttl span{display:block;font-size:10px;letter-spacing:.42em;color:var(--sub);margin-top:4px}

.grid{columns:1;column-gap:20px}
@media(min-width:640px){.grid{columns:2}}
@media(min-width:1000px){.grid{columns:3}}

.sec{break-inside:avoid;margin:0 0 20px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:15px 15px 7px;transition:border-color .2s}
.sec:hover{border-color:var(--line2)}
.sec .hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px}
.sec h3{font-size:19px;font-weight:800;color:var(--gold);display:flex;align-items:baseline;gap:7px}
.sec h3 em{font-style:normal;color:var(--gold2);font-size:10px}
.sec .en{font-size:9.5px;font-weight:700;letter-spacing:.18em;color:var(--sub);white-space:nowrap}
.sec .bar2{height:1px;background:linear-gradient(90deg,var(--gold2),rgba(196,154,74,.06));margin:8px 0 4px}
.sec .note{font-size:12px;color:var(--sub);margin:2px 0 6px;line-height:1.6}

.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed rgba(196,154,74,.16)}
.sec .row:last-child{border-bottom:none}
.row .nm{font-size:15.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.row .dot{flex:1;height:1px;background:repeating-linear-gradient(90deg,rgba(196,154,74,.3) 0 2px,transparent 2px 6px);align-self:center}
.row .pr{font-size:16px;font-weight:800;color:var(--gold);white-space:nowrap;letter-spacing:.02em}
.row .pr i{font-style:normal;font-size:10px;font-weight:500;color:var(--sub);margin-right:3px}
.row.star .nm,.row.star .pr{color:var(--star)}
.tagw{font-size:9px;font-weight:700;color:#120e07;background:linear-gradient(180deg,#E9C583,#C49A4A);
  border-radius:999px;padding:2px 7px;letter-spacing:.04em}

.sizes{display:flex;gap:6px}
.sizes b{min-width:46px;text-align:center;font-size:15px;font-weight:800;color:var(--gold);
  background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px 0}
.row.head{padding:2px 0 6px;border-bottom:1px solid var(--line)}
.row.head .lb{min-width:46px;text-align:center;font-size:9.5px;font-weight:700;letter-spacing:.1em;color:var(--sub)}
.row.star .sizes b{color:var(--star);border-color:rgba(226,169,138,.35)}

.fav{background:none;border:none;cursor:pointer;color:rgba(196,154,74,.35);font-size:15px;line-height:1;padding:2px}
.fav.on{color:var(--star)}

.extras{margin:4px 0 8px;border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;background:var(--panel)}
.extras h4{text-align:center;font-size:18px;font-weight:800;color:var(--gold)}
.extras p{text-align:center;font-size:13px;color:var(--sub);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:13px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 14px;font-size:13.5px}

.res-h{font-size:13px;color:var(--sub);margin:0 2px 14px;text-align:center}
.badge{font-size:10px;font-weight:700;color:var(--gold2);border:1px solid var(--line);
  border-radius:999px;padding:2px 8px;margin-right:6px}
.empty{text-align:center;padding:56px 16px;color:var(--sub)}
.empty b{display:block;font-size:17px;color:var(--item);margin-bottom:6px}

.top{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:18px;z-index:50;
  width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:rgba(18,14,7,.9);
  backdrop-filter:blur(8px);color:var(--gold);font-size:18px;cursor:pointer;display:grid;place-items:center;
  opacity:0;transform:translateY(10px);pointer-events:none;transition:.22s}
.top.show{opacity:1;transform:none;pointer-events:auto}

.fb{max-width:640px;margin:26px auto 0;text-align:center;border:1px solid var(--line);
  border-radius:var(--r);padding:20px 16px;background:var(--panel)}
.fb h4{font-size:18px;font-weight:800;color:var(--gold)}
.fb p{font-size:13.5px;color:var(--sub);margin-top:5px}
.fb .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.fb a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:14.5px;font-weight:700;
  border-radius:999px;padding:11px 20px;border:1px solid var(--line2);color:#F6E4B8;background:var(--panel2);transition:.16s}
.fb a:hover{background:rgba(196,154,74,.16)}
.fb a svg{width:18px;height:18px;fill:currentColor;flex:0 0 auto}

footer{text-align:center;padding:26px 16px 14px;color:#C8AC72;font-size:14px;line-height:2}
footer .di{color:var(--gold2);margin-bottom:6px}
footer a{color:#F6E4B8;text-decoration:none;border-bottom:1px solid var(--line2)}
footer .l2{font-size:9.5px;letter-spacing:.3em;color:var(--sub);margin-top:10px}

@media print{
  .bar,.jump,.top,.fav{display:none!important}
  body{background:#fff;color:#222}
  .page{display:block!important}
  .sec{border-color:#ccc;background:none;break-inside:avoid}
  .sec h3,.row .pr,.sizes b{color:#7a5a12}
}
</style>
</head>

مأكولات","en":"FOOD","extras":{"title":"الإضافات","sub":null,"items":["بطاطس 20/30 ج","تومية 15 ج","تركي 25 ج","جبنة 15 ج","صوص حار 15 ج","مايونيز 15 ج","بربيكيو 15 ج","شيدر 20 ج"]},"sections":[{"ar":"ركن الساندوتش","en":"SANDWICH CORNER","cols":["بلدي","فرنساوي"],"items":[["زنجر","—",50],["كريس بي","—",50],["فراخ","—",45],["فاهيتا","—",50],["ميكس فراخ","—",55],["ميكس لحوم","—",55],["كبده",20,40],["مجمج","—",40],["سجق",20,35],["بطاطس",15,30],["شاورما","—",50],["بانيه",25,45],["ستريبس",25,45],["حواوشي",20,"—"],["حواوشي ونس",50,"—",1]]},{"ar":"ركن النجريسكو","en":"NEGRESCO CORNER","cols":["S","L"],"items":[["نجريسكو فراخ",85,100],["نجريسكو لحمة",85,100],["نجريسكو سوسيس",75,95],["نجريسكو ونس",100,120,1]]},{"ar":"ركن الكريب","en":"CREPE CORNER","items":[["كريب شاورما",85],["كريب زنجر",90],["كريب كريس بي",90],["كريب بانيه",75],["كريب شيش",90],["كريب فاهيتا",95],["كريب سجق",75],["كريب سوسيس",75],["كريب ميكس لحوم",110],["كريب ميكس فراخ",110],["كريب بطاطس",50],["كريب ونس",130,1]]},{"ar":"ركن البيتزا","en":"PIZZA CORNER","cols":["S","M","L"],"items":[["بيتزا فراخ",100,130,160],["بيتزا لحمة",100,130,160],["بيتزا زنجر",110,140,170],["بيتزا سجق",100,130,160],["بيتزا مكس جبن",100,120,150],["بيتزا مرجريتا",90,110,130],["بيتزا ونس","—","—",190,1]]},{"ar":"ركن السوري","en":"SOURY CORNER","items":[["بطاطس",30],["بطاطس موتزريلا",40],["بطاطس صاروخ",50],["بطاطس + شاورما",85],["زنجر",85],["كريس بي",80],["سجق",65],["سوسيس",65],["ميكس لحوم",90],["ميكس فراخ",90],["شاورما",80],["صارووخ ونس",100,1]]},{"ar":"ركن البرجر","en":"BURGER CORNER","cols":["سنجل","دبل","تريبل"],"items":[["برجر فراخ",85,150,190],["برجر لحمة",85,150,190],["برجر زنجر",130,180,200],["برجر كريس بي",130,180,200]]},{"ar":"ركن الوجبات","en":"MEALS","sub":"تشمل: أرز · بطاطس · رغيف خبز · تومية · كاتشب","items":[["وجبة زنجر",120],["وجبة كريس بي",120]]}]}};
const KEYS = Object.keys(DATA);
const FAVKEY = 'wanas.favs.v1';
let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem(FAVKEY) || '[]')); } catch(e){}
let active = KEYS[0], query = '';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).replace(/[ً-ْـ]/g,'').replace(/[أإآٱ]/g,'ا')
  .replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/\s+/g,' ').trim().toLowerCase();

function nCols(sec){ return sec.cols ? sec.cols.length : 1; }
function isStar(sec, r){ return r.length > nCols(sec) + 1; }
function idOf(k, si, name){ return k + '|' + si + '|' + name; }

/* ---------------- tabs ---------------- */
const TABS = KEYS.concat(['favs']);
const TITLES = Object.assign({favs:'المفضلة'}, ...KEYS.map(k => ({[k]: DATA[k].title})));
$('tabs').innerHTML = TABS.map(k =>
  `<button data-k="${k}" ${k==='favs'?'id="favtab"':''}>${esc(TITLES[k])}</button>`).join('');
$('tabs').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  active = b.dataset.k; setQuery(''); render();
  window.scrollTo({top: 0, behavior: 'smooth'});
};

/* ---------------- search ---------------- */
function setQuery(v){ query = v; $('q').value = v; $('srch').classList.toggle('has', !!v); }
$('sbtn').onclick = () => {
  const s = $('srch'); s.classList.toggle('open');
  if(s.classList.contains('open')) $('q').focus(); else { setQuery(''); render(); }
};
$('q').addEventListener('input', e => { setQuery(e.target.value); render(); });
$('sclr').onclick = () => { setQuery(''); $('q').focus(); render(); };

/* ---------------- favourites ---------------- */
function toggleFav(id, el){
  favs.has(id) ? favs.delete(id) : favs.add(id);
  try { localStorage.setItem(FAVKEY, JSON.stringify([...favs])); } catch(e){}
  el.classList.toggle('on'); el.textContent = favs.has(id) ? '♥' : '♡';
  updateFavTab();
  if(active === 'favs') render();
}
function updateFavTab(){
  const b = $('favtab'); if(!b) return;
  b.textContent = favs.size ? 'المفضلة (' + favs.size + ')' : 'المفضلة';
}
document.addEventListener('click', e => {
  const f = e.target.closest('.fav'); if(f) toggleFav(f.dataset.id, f);
});

/* ---------------- rendering ---------------- */
function rowHTML(k, si, sec, r){
  const id = idOf(k, si, r[0]);
  const on = favs.has(id);
  const st = isStar(sec, r) ? ' star' : '';
  const heart = `<button class="fav${on?' on':''}" data-id="${esc(id)}" aria-label="حفظ في المفضلة">${on?'♥':'♡'}</button>`;
  const tag = st ? '<span class="tagw">ونس</span>' : '';
  if(sec.cols){
    return `<div class="row${st}"><div class="nm">${heart}${esc(r[0])}${tag}</div><div class="dot"></div>`
      + `<div class="sizes">${sec.cols.map((_,i)=>`<b>${esc(r[i+1])}</b>`).join('')}</div></div>`;
  }
  return `<div class="row${st}"><div class="nm">${heart}${esc(r[0])}${tag}</div><div class="dot"></div>`
    + `<div class="pr">${esc(r[1])}<i>ج</i></div></div>`;
}

function secHTML(k, si, sec, rows){
  let h = `<div class="sec" id="s-${k}-${si}"><div class="hd">`
    + `<h3>${esc(sec.ar)}<em>◆</em></h3><div class="en">${esc(sec.en)}</div></div><div class="bar2"></div>`;
  if(sec.sub) h += `<div class="note">${esc(sec.sub)}</div>`;
  if(sec.cols) h += `<div class="row head"><div class="nm"></div><div class="dot"></div>`
    + `<div class="sizes">${sec.cols.map(c=>`<span class="lb">${esc(c)}</span>`).join('')}</div></div>`;
  h += rows.map(r => rowHTML(k, si, sec, r)).join('');
  return h + '</div>';
}

function matches(sec, q){
  const n = norm(q);
  return sec.items.filter(r => norm(r[0]).includes(n) || norm(sec.ar).includes(n));
}

function searchView(){
  let total = 0, out = '';
  KEYS.forEach(k => {
    DATA[k].sections.forEach((sec, si) => {
      const rows = matches(sec, query);
      if(!rows.length) return;
      total += rows.length;
      const s = Object.assign({}, sec, {en: DATA[k].title});
      out += secHTML(k, si, s, rows);
    });
  });
  if(!total) return `<div class="empty"><b>مفيش نتايج لـ "${esc(query)}"</b>جرّبي اسم تاني أو امسحي البحث</div>`;
  return `<div class="res-h">${total} صنف مطابق</div><div class="grid">${out}</div>`;
}

function favsView(){
  let out = '', total = 0;
  KEYS.forEach(k => {
    DATA[k].sections.forEach((sec, si) => {
      const rows = sec.items.filter(r => favs.has(idOf(k, si, r[0])));
      if(!rows.length) return;
      total += rows.length;
      out += secHTML(k, si, Object.assign({}, sec, {en: DATA[k].title}), rows);
    });
  });
  if(!total) return `<div class="empty"><b>لسه مفيش مفضلة</b>دوسي على ♡ جنب أي صنف عشان يتحفظ هنا</div>`;
  return `<div class="grid">${out}</div>`;
}

function pageView(k){
  const d = DATA[k];
  let h = `<div class="ttl"><h2>${esc(d.title)}</h2><span>${esc(d.en.split('').join(' '))}</span></div>`;
  h += `<div class="grid">${d.sections.map((sec,si)=>secHTML(k,si,sec,sec.items)).join('')}</div>`;
  if(d.extras){
    h += `<div class="extras"><h4>${esc(d.extras.title)}</h4>`
      + (d.extras.sub ? `<p>${esc(d.extras.sub)}</p>` : '')
      + `<div class="chips">${d.extras.items.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>`;
  }
  return h;
}

function buildJump(){
  const j = $('jump');
  if(query || active === 'favs'){ j.style.display = 'none'; return; }
  j.style.display = 'flex';
  j.innerHTML = DATA[active].sections.map((s,i)=>
    `<a href="#s-${active}-${i}" data-t="s-${active}-${i}">${esc(s.ar)}</a>`).join('');
  observe();
}

let io;
function observe(){
  if(!('IntersectionObserver' in window)) return;
  if(io) io.disconnect();
  const links = [...$('jump').querySelectorAll('a')];
  if(!links.length) return;
  io = new IntersectionObserver(es => {
    es.forEach(e => {
      if(!e.isIntersecting) return;
      links.forEach(a => a.classList.toggle('on', a.dataset.t === e.target.id));
    });
  }, {rootMargin: '-150px 0px -70% 0px'});
  DATA[active].sections.forEach((_,i) => {
    const el = $(`s-${active}-${i}`); if(el) io.observe(el);
  });
}

function render(){
  [...$('tabs').children].forEach(b => b.classList.toggle('on', b.dataset.k === active));
  let body;
  if(query) body = searchView();
  else if(active === 'favs') body = favsView();
  else body = pageView(active);
  $('app').innerHTML = `<div class="page on">${body}</div>`;
  buildJump();
  updateFavTab();
}

/* ---------------- chrome ---------------- */
addEventListener('scroll', () => {
  $('bar').classList.toggle('stuck', scrollY > 40);
  $('top').classList.toggle('show', scrollY > 500);
}, {passive:true});
$('top').onclick = () => window.scrollTo({top:0,behavior:'smooth'});

render();
</script>
